<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CourseHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        nav {
            background: #111827;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: #60a5fa;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        .hero {
            text-align: center;
            padding: 70px 20px;
            background: #1e3a8a;
            color: white;
        }

        .hero h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .container {
            width: 84%;
            margin: 45px auto;
        }

        .container h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .courses {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .category {
            color: #2563eb;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .description {
            color: #6b7280;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .price {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        footer {
            text-align: center;
            padding: 25px;
            background: #111827;
            color: white;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <nav>
        <h2>🎓 CourseHub</h2>

        <div>
            <a href="/">Courses</a>
            <a href="/about">About</a>
        </div>
    </nav>

    <section class="hero">
        <h1>Learn. Build. Grow.</h1>
        <p>Upgrade your skills with our technology courses.</p>
    </section>

    <div class="container">

        <h2>Popular Courses</h2>

        <div class="courses">

            {% for course in courses %}

            <div class="card">

                <h3>{{ course.name }}</h3>

                <div class="category">
                    {{ course.category }}
                </div>

                <p class="description">
                    {{ course.description }}
                </p>

                <div class="price">
                    ₹{{ course.price }}
                </div>

                <button>
                    Enroll Now
                </button>

            </div>

            {% endfor %}

        </div>

    </div>

    <footer>
        © 2026 CourseHub | Flask CI/CD Project
    </footer>

</body>
</html>
