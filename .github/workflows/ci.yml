name: Flask CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Test Flask Application
        run: |
          python -c "from app import app; print('Flask application loaded successfully')"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/flask-cicd-project

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Stopping old Flask processes..."

            PIDS=$(ps -eo pid=,args= | awk '$2=="python3" && $3=="app.py" {print $1}')

            for PID in $PIDS; do
              echo "Stopping Flask process: $PID"
              kill "$PID" 2>/dev/null || true
            done

            sleep 2

            echo "Starting Flask application..."

            nohup python3 app.py > flask.log 2>&1 </dev/null &

            sleep 2

            echo "Checking Flask process..."

            ps -ef | grep '[p]ython3 app.py'

            echo "Deployment completed successfully."